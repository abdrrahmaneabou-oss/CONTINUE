name: V6 brake main-thread fix

on:
  push:
    branches:
      - v6-fast-monitor-brake

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply serialization fix
        run: python3 tools/v6_brake_mainthread_fix.py
      - name: Verify source
        run: |
          grep -q 'analogBrakeOpen == open' app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt
          grep -q 'versionCode = 64' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build
        run: gradle --no-daemon --rerun-tasks clean :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit clean source
        run: |
          rm -f .github/workflows/v6-brake-mainthread-fix.yml tools/v6_brake_mainthread_fix.py
          git config user.name CHATGPT
          git config user.email abdrrahmaneabou@gmail.com
          git add -A
          git commit -m 'fix: serialize V6 monitor brake with finger input'
          git push origin HEAD:v6-fast-monitor-brake
