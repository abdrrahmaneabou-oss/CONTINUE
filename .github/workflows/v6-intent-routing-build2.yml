''', 'move-return')
          s = s[:move_pos] + move_block + s[center_pos:]

          visual_start = s.index('    private fun rebuildKnobVisual() {')
          visual_end = s.index('    private fun baseCenter()', visual_start)
          s = s[:visual_start] + '''    private fun rebuildKnobVisual() {
        knobView?.apply {
            text = when (decision) {
                Decision.IDLE -> "R/L"
                Decision.PENDING -> "…"
                Decision.R_ACTIVE -> "R"
                Decision.L_ACTIVE -> "L"
