    private var lastQuickTapUpMs = 0L

    val bindingLabel: String get() = binding.name
    val baseSizeLabel: String get() = formatSize(baseSizeHundredths)
    val knobSizeLabel: String get() = formatSize(knobSizeHundredths)
''',
