    fun increaseBaseSize() = setBaseSize(stepSize(baseSizeHundredths, +1))
    fun decreaseKnobSize() = setKnobSize(stepSize(knobSizeHundredths, -1))
    fun increaseKnobSize() = setKnobSize(stepSize(knobSizeHundredths, +1))

