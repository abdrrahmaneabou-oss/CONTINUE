name: V6 FAST monitor brake build

on:
  push:
    branches:
      - v6-fast-monitor-brake

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        run: python3 tools/v6_fast_brake_patch.py

      - name: Verify V6 FAST brake invariants
        shell: bash
        run: |
          set -euo pipefail
          C=app/src/main/java/com/pixeltrigger/app/AnalogShoulderController.kt
          S=app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt
          grep -q 'decision == Decision.L_ACTIVE && fastEnabled && reachedRLimit' "$C"
          grep -q 'private fun reconcileOutput()' "$C"
          grep -q 'fun setBrakeOpen(open: Boolean)' "$C"
          grep -q 'val open = !sample.isArmingWhite()' "$S"
          grep -q 'مكابح المراقبة ON' "$C"
          grep -q 'beginAnalogBrakeEditing' "$S"
          grep -q 'ANALOG_BRAKE_POSITION_KEY' "$S"
          grep -q 'versionCode = 64' app/build.gradle.kts
          grep -q 'versionName = "6.2-fast-monitor-brake"' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build
        run: gradle --no-daemon --rerun-tasks clean :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v6-fast-monitor-brake-build.yml
          rm -f tools/v6_fast_brake_patch.py
          git config user.name CHATGPT
          git config user.email abdrrahmaneabou@gmail.com
          git add -A
          git commit -m 'feat: add V6 FAST routing and monitor brake gate'
          git push origin HEAD:v6-fast-monitor-brake
