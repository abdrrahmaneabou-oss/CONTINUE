      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          C=app/src/main/java/com/pixeltrigger/app/AnalogShoulderController.kt
          S=app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt
          ! grep -q 'TRIPLE_TAP\|quickTapCount\|KEY_BINDING\|bindingLabel' "$C"
          ! grep -q 'analogShoulder.bindingLabel\|3 نقرات سريعة تبدّل R/L' "$S"
          grep -q 'Decision.PENDING' "$C"
          grep -q 'activateDecision(Binding.R)' "$C"
          grep -q 'activateDecision(Binding.L)' "$C"
          grep -q 'actualDistance + 0.5f >= maxOffset' "$C"
          grep -q 'DECISION_DELAY_MIN_MS = 50' "$C"
          grep -q 'DECISION_DELAY_MAX_MS = 500' "$C"
          grep -q 'DECISION_DELAY_STEP_MS = 50' "$C"
          grep -q 'versionCode = 63' app/build.gradle.kts
          grep -q 'versionName = "6.1-intent-routing"' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build
        run: gradle --no-daemon --rerun-tasks clean :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit clean source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v6-intent-routing-build.yml
          rm -f .github/workflows/v6-intent-routing-build2.yml
          git config user.name 'CHATGPT'
          git config user.email 'abdrrahmaneabou@gmail.com'
          git add app/build.gradle.kts \
                  app/src/main/java/com/pixeltrigger/app/AnalogShoulderController.kt \
                  app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt \
                  .github/workflows/v6-intent-routing-build.yml \
                  .github/workflows/v6-intent-routing-build2.yml
          git commit -m 'feat: route V6 analog intent to R drag or delayed L'
          git push origin HEAD:v6-intent-routing
