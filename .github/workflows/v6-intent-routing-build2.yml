    val knobSizeLabel: String get() = formatSize(knobSizeHundredths)
    val decisionDelayLabel: String get() = "$decisionDelayMs ms"
''', 'fields')

          s = once(s,
          '''    fun beginEditing() {
        forceRelease()
        quickTapCount = 0
        isEditing = true
