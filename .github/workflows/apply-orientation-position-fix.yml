                  shoulderPreferences = getSharedPreferences(ShoulderCaptureService.PREFS_NAME, MODE_PRIVATE)
                  circlesVisible = preferences.getBoolean(KEY_CIRCLES_VISIBLE, true)
          ''',
          '''        preferences = getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
                  shoulderPreferences = getSharedPreferences(ShoulderCaptureService.PREFS_NAME, MODE_PRIVATE)
                  positionStore = OrientationPositionStore(preferences)
                  circlesVisible = preferences.getBoolean(KEY_CIRCLES_VISIBLE, true)
          ''')

          replace_once(screen,
          '''    private var targetView: TargetOverlayView? = null
              private var targetParams: WindowManager.LayoutParams? = null
              private var targetTouchSize = 1
          ''',
          '''    private var targetView: TargetOverlayView? = null
              private var targetParams: WindowManager.LayoutParams? = null
              private var targetTouchSize = 1
              private var targetVisibleDiameter = 1
          ''')

          replace_once(screen,
          '''            val lp = overlayParams(sensorTouchSize, sensorTouchSize).apply {
                          x = preferences.getInt(sensorKeyX(group), defaultX)
                          y = preferences.getInt(sensorKeyY(group), defaultY)
                      }
          ''',
          '''            val savedPosition = loadRightSensorPosition(group, 0, defaultX, defaultY)
                      val lp = overlayParams(sensorTouchSize, sensorTouchSize).apply {
                          x = savedPosition.x
                          y = savedPosition.y
                      }
          ''')

          replace_once(screen,
          '''            attachDrag(sensor, lp, sensorVisibleDiameter) { x, y ->
                          detectionEngines[savedGroup].resetForSensorMove()
                          preferences.edit().putInt(sensorKeyX(savedGroup), x).putInt(sensorKeyY(savedGroup), y).apply()
                      }
          ''',
          '''            attachDrag(sensor, lp, sensorVisibleDiameter) { x, y ->
                          detectionEngines[savedGroup].resetForSensorMove()
                          saveRightSensorPosition(savedGroup, 0, x, y)
                      }
          ''')

          replace_once(screen,
          '''        val targetVisibleDiameter = max(mmToPx(5f), dp(12))
                  targetTouchSize = max(dp(52), dp(24) + targetVisibleDiameter)
                  val target = TargetOverlayView(this, targetVisibleDiameter)
                  val targetLp = overlayParams(targetTouchSize, targetTouchSize).apply {
                      x = preferences.getInt(KEY_TARGET_X, screenWidth / 2 + dp(70))
                      y = preferences.getInt(KEY_TARGET_Y, screenHeight / 2 - targetTouchSize / 2)
                  }
          ''',
          '''        targetVisibleDiameter = max(mmToPx(5f), dp(12))
                  targetTouchSize = max(dp(52), dp(24) + targetVisibleDiameter)
                  val target = TargetOverlayView(this, targetVisibleDiameter)
                  val savedTargetPosition = loadTargetPosition(
                      screenWidth / 2 + dp(70),
                      screenHeight / 2 - targetTouchSize / 2,
                  )
                  val targetLp = overlayParams(targetTouchSize, targetTouchSize).apply {
                      x = savedTargetPosition.x
                      y = savedTargetPosition.y
                  }
          ''')

          replace_once(screen,
          '''        attachDrag(target, targetLp, targetVisibleDiameter) { x, y ->
                      preferences.edit().putInt(KEY_TARGET_X, x).putInt(KEY_TARGET_Y, y).apply()
                  }
          ''',
          '''        attachDrag(target, targetLp, targetVisibleDiameter) { x, y ->
                      saveTargetPosition(x, y)
                  }
          ''')

          replace_once(screen,
          '''            val sensor = SensorOverlayView(this, sensorVisibleDiameter)
                      val lp = overlayParams(sensorTouchSize, sensorTouchSize).apply {
                          x = preferences.getInt(sensorKeyX(GROUP_FIVE_INDEX, slot), groupFiveDefaultX(slot))
                          y = preferences.getInt(sensorKeyY(GROUP_FIVE_INDEX, slot), groupFiveDefaultY())
                      }
          ''',
          '''            val sensor = SensorOverlayView(this, sensorVisibleDiameter)
                      val savedPosition = loadRightSensorPosition(
                          GROUP_FIVE_INDEX,
                          slot,
                          groupFiveDefaultX(slot),
                          groupFiveDefaultY(),
                      )
                      val lp = overlayParams(sensorTouchSize, sensorTouchSize).apply {
                          x = savedPosition.x
                          y = savedPosition.y
                      }
          ''')

          replace_once(screen,
          '''            attachDrag(sensor, lp, sensorVisibleDiameter) { x, y ->
                          groupFiveExtraEngines[savedExtra].resetForSensorMove()
                          preferences.edit()
                              .putInt(sensorKeyX(GROUP_FIVE_INDEX, savedExtra + 1), x)
                              .putInt(sensorKeyY(GROUP_FIVE_INDEX, savedExtra + 1), y)
                              .apply()
                      }
          ''',
          '''            attachDrag(sensor, lp, sensorVisibleDiameter) { x, y ->
                          groupFiveExtraEngines[savedExtra].resetForSensorMove()
                          saveRightSensorPosition(GROUP_FIVE_INDEX, savedExtra + 1, x, y)
                      }
          ''')

          replace_once(screen,
          '''                    preferences.edit()
                                  .putInt(sensorKeyX(GROUP_FIVE_INDEX, slot), lp.x)
                                  .putInt(sensorKeyY(GROUP_FIVE_INDEX, slot), lp.y)
                                  .apply()
          ''',
          '''                    saveRightSensorPosition(GROUP_FIVE_INDEX, slot, lp.x, lp.y)
          ''')

          replace_once(screen,
          '''        preferences.edit().putInt(sensorKeyX(activeGroup), lp.x).putInt(sensorKeyY(activeGroup), lp.y).apply()
          ''',
          '''        saveRightSensorPosition(activeGroup, 0, lp.x, lp.y)
          ''')

          replace_once(screen,
          '''        sensorParams.forEachIndexed { i, lp ->
                      val view = sensorViews[i]
                      if (lp != null && view != null) {
                          clampCirclePosition(lp, sensorVisibleDiameter)
                          runCatching { windowManager.updateViewLayout(view, lp) }
                      }
                  }
                  groupFiveExtraParams.forEachIndexed { i, lp ->
                      val view = groupFiveExtraViews[i]
                      if (lp != null && view != null) {
                          clampCirclePosition(lp, sensorVisibleDiameter)
                          runCatching { windowManager.updateViewLayout(view, lp) }
                      }
                  }
                  targetParams?.let { lp ->
                      targetView?.let { runCatching { windowManager.updateViewLayout(it, lp) } }
                  }
          ''',
          '''        restoreRightOverlayPositionsForCurrentProfile()
          ''')

          marker = '''    private fun sensorKeyX(group: Int, slot: Int = 0): String = when {
          '''
          helpers = '''    private fun rightSensorPositionKey(group: Int, slot: Int): String =
                  "right.monitor.g${group + 1}.s${slot + 1}"

              private fun loadRightSensorPosition(
                  group: Int,
                  slot: Int,
                  fallbackX: Int,
                  fallbackY: Int,
              ): OrientationPositionStore.Position = positionStore.load(
                  keyPrefix = rightSensorPositionKey(group, slot),
                  screenWidth = screenWidth,
                  screenHeight = screenHeight,
                  overlayWidth = sensorTouchSize,
                  overlayHeight = sensorTouchSize,
                  fallbackX = fallbackX,
                  fallbackY = fallbackY,
                  legacyXKey = sensorKeyX(group, slot),
                  legacyYKey = sensorKeyY(group, slot),
              )

              private fun saveRightSensorPosition(group: Int, slot: Int, x: Int, y: Int) {
                  positionStore.save(
                      keyPrefix = rightSensorPositionKey(group, slot),
                      x = x,
                      y = y,
                      screenWidth = screenWidth,
                      screenHeight = screenHeight,
                      overlayWidth = sensorTouchSize,
                      overlayHeight = sensorTouchSize,
                      legacyXKey = sensorKeyX(group, slot),
                      legacyYKey = sensorKeyY(group, slot),
                  )
              }

              private fun loadTargetPosition(
                  fallbackX: Int,
                  fallbackY: Int,
              ): OrientationPositionStore.Position = positionStore.load(
                  keyPrefix = RIGHT_TARGET_POSITION_KEY,
                  screenWidth = screenWidth,
                  screenHeight = screenHeight,
                  overlayWidth = targetTouchSize,
                  overlayHeight = targetTouchSize,
                  fallbackX = fallbackX,
                  fallbackY = fallbackY,
                  legacyXKey = KEY_TARGET_X,
                  legacyYKey = KEY_TARGET_Y,
              )

              private fun saveTargetPosition(x: Int, y: Int) {
                  positionStore.save(
                      keyPrefix = RIGHT_TARGET_POSITION_KEY,
                      x = x,
                      y = y,
                      screenWidth = screenWidth,
                      screenHeight = screenHeight,
                      overlayWidth = targetTouchSize,
                      overlayHeight = targetTouchSize,
                      legacyXKey = KEY_TARGET_X,
                      legacyYKey = KEY_TARGET_Y,
                  )
              }

              /**
               * Rotation never clamps the previous orientation in-place. Every
               * overlay is reloaded from the profile belonging to the new geometry.
               * If that profile has never been edited, OrientationPositionStore only
               * projects the opposite profile temporarily and leaves it untouched.
               */
              private fun restoreRightOverlayPositionsForCurrentProfile() {
                  var group = 0
                  while (group < GROUP_COUNT) {
                      val lp = sensorParams[group]
                      val view = sensorViews[group]
                      if (lp != null && view != null) {
                          val fallbackX = if (group == GROUP_FIVE_INDEX) groupFiveDefaultX(0)
                          else screenWidth / 2 - sensorTouchSize / 2
                          val fallbackY = screenHeight / 2 - sensorTouchSize / 2
                          val saved = loadRightSensorPosition(group, 0, fallbackX, fallbackY)
                          lp.x = saved.x
                          lp.y = saved.y
                          clampCirclePosition(lp, sensorVisibleDiameter)
                          runCatching { windowManager.updateViewLayout(view, lp) }
                      }
                      group++
                  }

                  var extra = 0
                  while (extra < GROUP_FIVE_EXTRA_COUNT) {
                      val slot = extra + 1
                      val lp = groupFiveExtraParams[extra]
                      val view = groupFiveExtraViews[extra]
                      if (lp != null && view != null) {
                          val saved = loadRightSensorPosition(
                              GROUP_FIVE_INDEX,
                              slot,
                              groupFiveDefaultX(slot),
                              groupFiveDefaultY(),
                          )
                          lp.x = saved.x
                          lp.y = saved.y
                          clampCirclePosition(lp, sensorVisibleDiameter)
                          runCatching { windowManager.updateViewLayout(view, lp) }
                      }
                      extra++
                  }

                  val targetLp = targetParams
                  val target = targetView
                  if (targetLp != null && target != null) {
                      val saved = loadTargetPosition(
                          screenWidth / 2 + dp(70),
                          screenHeight / 2 - targetTouchSize / 2,
                      )
                      targetLp.x = saved.x
                      targetLp.y = saved.y
                      clampCirclePosition(targetLp, targetVisibleDiameter)
                      runCatching { windowManager.updateViewLayout(target, targetLp) }
                  }
              }

          '''
          p = Path(screen)
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit(f'{screen}: helper insertion marker mismatch')
          p.write_text(text.replace(marker, helpers + marker, 1))

          replace_once(screen,
          '''        private const val KEY_REARM_DELAY_ENABLED = "rearm_delay_enabled"
          ''',
          '''        private const val KEY_REARM_DELAY_ENABLED = "rearm_delay_enabled"
                  private const val RIGHT_TARGET_POSITION_KEY = "right.target"
          ''')

          manual = 'app/src/main/java/com/pixeltrigger/app/ManualNubiaPairController.kt'
          replace_once(manual,
          '''    private enum class Binding { R, L }
          ''',
          '''    private enum class Binding { R, L }

              private val positionStore = OrientationPositionStore(preferences)
          ''')

          replace_once(manual,
          '''        val view = ManualCircleView(context, triggerDiameter)
                  val params = WindowManager.LayoutParams(
          ''',
          '''        val view = ManualCircleView(context, triggerDiameter)
                  val savedPosition = positionStore.load(
                      keyPrefix = MANUAL_POSITION_KEY,
                      screenWidth = screenWidth,
                      screenHeight = screenHeight,
                      overlayWidth = triggerDiameter,
                      overlayHeight = triggerDiameter,
                      fallbackX = dp(16),
                      fallbackY = screenHeight / 2 - triggerDiameter / 2,
                      legacyXKey = KEY_TRIGGER_X,
                      legacyYKey = KEY_TRIGGER_Y,
                  )
                  val params = WindowManager.LayoutParams(
          ''')

          replace_once(manual,
          '''            x = preferences.getInt(KEY_TRIGGER_X, dp(16))
                      y = preferences.getInt(KEY_TRIGGER_Y, screenHeight / 2 - triggerDiameter / 2)
          ''',
          '''            x = savedPosition.x
                      y = savedPosition.y
          ''')

          replace_once(manual,
          '''    fun updateBounds(width: Int, height: Int) {
                  screenWidth = width.coerceAtLeast(1)
                  screenHeight = height.coerceAtLeast(1)
                  circle?.let { current ->
                      clamp(current.params)
                      runCatching { windowManager.updateViewLayout(current.view, current.params) }
                  }
              }
          ''',
          '''    fun updateBounds(width: Int, height: Int) {
                  screenWidth = width.coerceAtLeast(1)
                  screenHeight = height.coerceAtLeast(1)
                  circle?.let { current ->
                      val saved = positionStore.load(
                          keyPrefix = MANUAL_POSITION_KEY,
                          screenWidth = screenWidth,
                          screenHeight = screenHeight,
                          overlayWidth = current.params.width,
                          overlayHeight = current.params.height,
                          fallbackX = dp(16),
                          fallbackY = screenHeight / 2 - current.params.height / 2,
                          legacyXKey = current.keyX,
                          legacyYKey = current.keyY,
                      )
                      current.params.x = saved.x
                      current.params.y = saved.y
                      clamp(current.params)
                      runCatching { windowManager.updateViewLayout(current.view, current.params) }
                  }
              }
          ''')

          replace_once(manual,
          '''    private fun save(current: Circle) {
                  preferences.edit()
                      .putInt(current.keyX, current.params.x)
                      .putInt(current.keyY, current.params.y)
                      .apply()
              }
          ''',
          '''    private fun save(current: Circle) {
                  positionStore.save(
                      keyPrefix = MANUAL_POSITION_KEY,
                      x = current.params.x,
                      y = current.params.y,
                      screenWidth = screenWidth,
                      screenHeight = screenHeight,
                      overlayWidth = current.params.width,
                      overlayHeight = current.params.height,
                      legacyXKey = current.keyX,
                      legacyYKey = current.keyY,
                  )
              }
          ''')

          replace_once(manual,
          '''        private const val KEY_BINDING = "manual_shoulder_binding"
          ''',
          '''        private const val KEY_BINDING = "manual_shoulder_binding"
                  private const val MANUAL_POSITION_KEY = "manual.trigger"
          ''')

          shoulder = 'app/src/main/java/com/pixeltrigger/app/ShoulderCaptureService.kt'
          replace_once(shoulder,
          '''    private lateinit var prefs: SharedPreferences
              private lateinit var shoulderInput: ShoulderShizukuEngine
          ''',
          '''    private lateinit var prefs: SharedPreferences
              private lateinit var positionStore: OrientationPositionStore
              private lateinit var shoulderInput: ShoulderShizukuEngine
          ''')

          replace_once(shoulder,
          '''        prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
                  engineEnabled = prefs.getBoolean(KEY_ENGINE_ENABLED, true)
          ''',
          '''        prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
                  positionStore = OrientationPositionStore(prefs)
                  engineEnabled = prefs.getBoolean(KEY_ENGINE_ENABLED, true)
          ''')

          replace_once(shoulder,
          '''        if (sourceWidth > 0) screenWidth = sourceWidth
                  if (sourceHeight > 0) screenHeight = sourceHeight
                  if (screenWidth <= 0 || screenHeight <= 0) return
          ''',
          '''        if (
                      sourceWidth > 0 && sourceHeight > 0 &&
                      (sourceWidth != screenWidth || sourceHeight != screenHeight)
                  ) {
                      screenWidth = sourceWidth
                      screenHeight = sourceHeight
                      mainHandler.post {
                          restoreCirclePositionsForCurrentProfile()
                          rDetector.resetForSensorMove()
                          lDetector.resetForSensorMove()
                          refreshStatusViews()
                      }
                      // Skip the transition frame so stale portrait coordinates can
                      // never be sampled against landscape geometry (or vice versa).
                      return
                  }
                  if (screenWidth <= 0 || screenHeight <= 0) return
          ''')

          replace_once(shoulder,
          '''    private fun createCircle(side: Side): SensorOverlayView {
                  val view = SensorOverlayView(this, visibleDiameter)
                  val lp = overlayParams(touchSize, touchSize).apply {
                      x = normalizedPosition(side, "x", defaultX(side), screenWidth)
                      y = normalizedPosition(side, "y", screenHeight / 2 - touchSize / 2, screenHeight)
                      flags = baseFlags() or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
          ''',
          '''    private fun createCircle(side: Side): SensorOverlayView {
                  val view = SensorOverlayView(this, visibleDiameter)
                  val prefix = shoulderPositionPrefix(side)
                  val saved = positionStore.load(
                      keyPrefix = prefix,
                      screenWidth = screenWidth,
                      screenHeight = screenHeight,
                      overlayWidth = touchSize,
                      overlayHeight = touchSize,
                      fallbackX = normalizedPosition(side, "x", defaultX(side), screenWidth),
                      fallbackY = normalizedPosition(side, "y", screenHeight / 2 - touchSize / 2, screenHeight),
                  )
                  val lp = overlayParams(touchSize, touchSize).apply {
                      x = saved.x
                      y = saved.y
                      flags = baseFlags() or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
          ''')

          replace_once(shoulder,
          '''        attachDrag(view, lp, side)
                  return view
              }
          ''',
          '''        attachDrag(view, lp, side)
                  if (positionStore.isPortrait(screenWidth, screenHeight) && !positionStore.hasSaved(prefix, screenWidth, screenHeight)) {
                      savePosition(side, lp)
                  }
                  return view
              }
          ''')

          replace_once(shoulder,
          '''    private fun savePosition(side: Side, lp: WindowManager.LayoutParams) {
                  prefs.edit()
                      .putFloat(positionKey(side, "x"), lp.x.toFloat() / screenWidth.toFloat())
                      .putFloat(positionKey(side, "y"), lp.y.toFloat() / screenHeight.toFloat())
                      .apply()
              }

              private fun positionKey(side: Side, axis: String) = "shoulder_${side.name.lowercase()}_${axis}"
          ''',
          '''    private fun savePosition(side: Side, lp: WindowManager.LayoutParams) {
                  positionStore.save(
                      keyPrefix = shoulderPositionPrefix(side),
                      x = lp.x,
                      y = lp.y,
                      screenWidth = screenWidth,
                      screenHeight = screenHeight,
                      overlayWidth = touchSize,
                      overlayHeight = touchSize,
                  )
                  // Preserve the old normalized portrait keys for downgrade/source
                  // compatibility, but landscape must never overwrite them.
                  if (positionStore.isPortrait(screenWidth, screenHeight)) {
                      prefs.edit()
                          .putFloat(positionKey(side, "x"), lp.x.toFloat() / screenWidth.toFloat())
                          .putFloat(positionKey(side, "y"), lp.y.toFloat() / screenHeight.toFloat())
                          .apply()
                  }
              }

              private fun shoulderPositionPrefix(side: Side): String =
                  "shoulder.${side.name.lowercase()}"

              private fun restoreCirclePositionsForCurrentProfile() {
                  restoreSidePosition(Side.R, rView, rParams)
                  restoreSidePosition(Side.L, lView, lParams)
              }

              private fun restoreSidePosition(
                  side: Side,
                  view: SensorOverlayView?,
                  lp: WindowManager.LayoutParams?,
              ) {
                  if (view == null || lp == null) return
                  val saved = positionStore.load(
                      keyPrefix = shoulderPositionPrefix(side),
                      screenWidth = screenWidth,
                      screenHeight = screenHeight,
                      overlayWidth = touchSize,
                      overlayHeight = touchSize,
                      fallbackX = normalizedPosition(side, "x", defaultX(side), screenWidth),
                      fallbackY = normalizedPosition(side, "y", screenHeight / 2 - touchSize / 2, screenHeight),
                  )
                  lp.x = saved.x
                  lp.y = saved.y
                  clamp(lp, touchSize, touchSize)
                  runCatching { windowManager.updateViewLayout(view, lp) }
              }

              private fun positionKey(side: Side, axis: String) = "shoulder_${side.name.lowercase()}_${axis}"
          ''')

          gradle = 'app/build.gradle.kts'
          replace_once(gradle,
          '''        versionCode = 58
                  versionName = "5.0-group5-triple-restore-state"
          ''',
          '''        versionCode = 59
                  versionName = "5.0-orientation-position-profiles"
          ''')
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -R "versionCode = 59" app/build.gradle.kts
          grep -R "class OrientationPositionStore" app/src/main/java/com/pixeltrigger/app/OrientationPositionStore.kt

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-orientation-position-fix.yml
          git config user.name 'CHATGPT'
