name: V6 split instant build

on:
  push:
    branches: [v6-final-split-instant]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python3 tools/apply_v6_split_final.py
      - name: Verify architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'visible R -> existing internal L path' app/src/main/java/com/pixeltrigger/app/AnalogShoulderController.kt
          grep -q 'visible L -> existing internal R path' app/src/main/java/com/pixeltrigger/app/AnalogShoulderController.kt
          grep -q 'beginFingerHoldL()' app/src/main/java/com/pixeltrigger/app/AnalogShoulderController.kt
          grep -q 'beginFingerHoldR()' app/src/main/java/com/pixeltrigger/app/AnalogShoulderController.kt
          ! grep -q 'analogBrake' app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt
          ! grep -q 'decisionDelayLabel' app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt
          ! grep -q 'dragSensitivityLabel' app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt
          grep -q 'versionCode = 66' app/build.gradle.kts
          grep -q 'versionName = "6.4-split-instant-shoulders"' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit clean source
        shell: bash
        run: |
          rm -f tools/apply_v6_split_final.py .github/workflows/v6-split-instant-build.yml
          git config user.name "CHATGPT"
          git config user.email "abdrrahmaneabou@gmail.com"
          git add -A
          git commit -m "feat: split V6 into instant R and L circles"
          git push origin HEAD:v6-final-split-instant
