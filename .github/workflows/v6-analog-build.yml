name: V6 analog shoulder integration

on:
  push:
    branches: [ v6-analog-shoulder ]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Integrate V6 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'anchor not found: {label}')
              return text.replace(old, new, 1)

          # ShoulderCaptureService: expose a finger-owned continuous R/L lifecycle
          # while preserving the existing timed FIRE path.
          p = Path('app/src/main/java/com/pixeltrigger/app/ShoulderCaptureService.kt')
          s = p.read_text()

          s = replace_once(s,
          '''    private var lastInputReady = false\n    private var wakeLock: PowerManager.WakeLock? = null''',
          '''    private var lastInputReady = false\n    private var fingerHeldSide: Side? = null\n    private var wakeLock: PowerManager.WakeLock? = null''',
          'shoulder finger field')

          s = replace_once(s,
          '''        if (manualReservedSide == side) return''',
          '''        if (manualReservedSide == side || fingerReservedSide == side) return''',
          'shoulder detector reservation')

          anchor = '''    private fun fireConfiguredSide(side: Side): Boolean {\n        if (!::shoulderInput.isInitialized) return false\n        if (!shoulderInput.isReady()) {\n            shoulderInput.connect()\n            return false\n        }\n        return if (side == Side.R) {\n            shoulderInput.fireR(pressDurationMs(Side.R))\n        } else {\n            shoulderInput.fireL(pressDurationMs(Side.L))\n        }\n    }\n\n    private fun createOverlays()'''
          replacement = '''    private fun fireConfiguredSide(side: Side): Boolean {\n        if (!::shoulderInput.isInitialized) return false\n        if (!shoulderInput.isReady()) {\n            shoulderInput.connect()\n            return false\n        }\n        return if (side == Side.R) {\n            shoulderInput.fireR(pressDurationMs(Side.R))\n        } else {\n            shoulderInput.fireL(pressDurationMs(Side.L))\n        }\n    }\n\n    /** V6 finger DOWN: reserve that detector side and keep F7/F8 physically held. */\n    private fun beginFingerHoldSide(side: Side): Boolean {\n        if (!engineEnabled || !::shoulderInput.isInitialized) return false\n        if (!shoulderInput.isReady()) {\n            shoulderInput.connect()\n            return false\n        }\n\n        val previous = fingerHeldSide\n        if (previous != null && previous != side) endFingerHoldSide(previous)\n\n        fingerReservedSide = side\n        fingerHeldSide = side\n        onManualReservationChanged()\n        val pressed = if (side == Side.R) shoulderInput.pressR() else shoulderInput.pressL()\n        if (!pressed) {\n            fingerHeldSide = null\n            if (fingerReservedSide == side) fingerReservedSide = null\n            onManualReservationChanged()\n        }\n        return pressed\n    }\n\n    /** V6 finger UP/CANCEL. No duration is guessed; UP happens at this call. */\n    private fun endFingerHoldSide(requestedSide: Side?): Boolean {\n        if (!::shoulderInput.isInitialized) return false\n        val target = requestedSide ?: fingerHeldSide\n        if (target == null) {\n            fingerReservedSide = null\n            return true\n        }\n        val released = if (target == Side.R) shoulderInput.releaseR() else shoulderInput.releaseL()\n        if (fingerHeldSide == target || requestedSide == null) fingerHeldSide = null\n        if (fingerReservedSide == target || requestedSide == null) fingerReservedSide = null\n        onManualReservationChanged()\n        return released\n    }\n\n    private fun createOverlays()'''
          s = replace_once(s, anchor, replacement, 'continuous shoulder methods')

          s = replace_once(s,
          '''        if (!enabled) shoulderInput.releaseAll()''',
          '''        if (!enabled) {\n            endFingerHoldSide(null)\n            shoulderInput.releaseAll()\n        }''',
          'disable shoulder release')

          s = replace_once(s,
          '''            manualReservedSide == side -> SensorStatus.OFF''',
          '''            manualReservedSide == side || fingerReservedSide == side -> SensorStatus.OFF''',
          'status reservation')

          s = replace_once(s,
          '''        val reserved = manualReservedSide?.name?.let { " • Manual $it" } ?: ""\n        return "R $r  •  L $l  •  $state$reserved"''',
          '''        val manual = manualReservedSide?.name?.let { " • Manual $it" } ?: ""\n        val finger = fingerReservedSide?.name?.let { " • V6 hold $it" } ?: ""\n        return "R $r  •  L $l  •  $state$manual$finger"''',
          'summary reservation')

          s = replace_once(s,
          '''        if (::shoulderInput.isInitialized) {\n            shoulderInput.releaseAll()\n            shoulderInput.disconnect()\n        }''',
          '''        if (::shoulderInput.isInitialized) {\n            endFingerHoldSide(null)\n            shoulderInput.releaseAll()\n            shoulderInput.disconnect()\n        }''',
          'destroy release')

          s = replace_once(s,
          '''        @Volatile private var activeInstance: ShoulderCaptureService? = null\n        @Volatile private var manualReservedSide: Side? = null''',
          '''        @Volatile private var activeInstance: ShoulderCaptureService? = null\n        @Volatile private var manualReservedSide: Side? = null\n        @Volatile private var fingerReservedSide: Side? = null''',
          'companion reservation field')

          s = replace_once(s,
          '''        fun fireConfiguredL(): Boolean = activeInstance?.fireConfiguredSide(Side.L) ?: false\n\n        fun reserveManualR()''',
          '''        fun fireConfiguredL(): Boolean = activeInstance?.fireConfiguredSide(Side.L) ?: false\n\n        fun beginFingerHoldR(): Boolean = activeInstance?.beginFingerHoldSide(Side.R) ?: false\n\n        fun beginFingerHoldL(): Boolean = activeInstance?.beginFingerHoldSide(Side.L) ?: false\n\n        fun endFingerHoldR(): Boolean = activeInstance?.endFingerHoldSide(Side.R) ?: false\n\n        fun endFingerHoldL(): Boolean = activeInstance?.endFingerHoldSide(Side.L) ?: false\n\n        fun endAnyFingerHold(): Boolean = activeInstance?.endFingerHoldSide(null) ?: false\n\n        fun reserveManualR()''',
          'companion finger API')

          s = s.replace('PixelTrigger V5 — R/L', 'PixelTrigger V6 — R/L')
          p.write_text(s)

          # ScreenCaptureService: own V6 overlay lifecycle and menu.
          p = Path('app/src/main/java/com/pixeltrigger/app/ScreenCaptureService.kt')
          s = p.read_text()

          s = replace_once(s,
          '''    private lateinit var manualTapPair: ManualNubiaPairController\n\n    private var menuButton''',
          '''    private lateinit var manualTapPair: ManualNubiaPairController\n    private lateinit var analogShoulder: AnalogShoulderController\n\n    private var menuButton''',
          'analog field')

          s = replace_once(s,
          '''        manualTapPair = ManualNubiaPairController(this, windowManager, preferences)\n        manualTapPair.create(screenWidth, screenHeight)\n\n        val buttonSize''',
          '''        manualTapPair = ManualNubiaPairController(this, windowManager, preferences)\n        manualTapPair.create(screenWidth, screenHeight)\n\n        analogShoulder = AnalogShoulderController(this, windowManager, preferences)\n        analogShoulder.create(screenWidth, screenHeight)\n        analogShoulder.setInputEnabled(shoulderHalfEnabled)\n\n        val buttonSize''',
          'analog create')

          s = replace_once(s,
          '''            if (!circleEditMode && (!::manualTapPair.isInitialized || !manualTapPair.isEditing)) {''',
          '''            if (\n                !circleEditMode &&\n                (!::manualTapPair.isInitialized || !manualTapPair.isEditing) &&\n                (!::analogShoulder.isInitialized || !analogShoulder.isEditing)\n            ) {''',
          'hold edit guard')

          s = replace_once(s,
          '''        runCatching {\n            startService(Intent(this, ShoulderCaptureService::class.java).apply {\n                action = ShoulderCaptureService.ACTION_SET_ENABLED\n                putExtra(ShoulderCaptureService.EXTRA_ENABLED, enabled)\n            })\n        }\n        updateButtonVisual()''',
          '''        runCatching {\n            startService(Intent(this, ShoulderCaptureService::class.java).apply {\n                action = ShoulderCaptureService.ACTION_SET_ENABLED\n                putExtra(ShoulderCaptureService.EXTRA_ENABLED, enabled)\n            })\n        }\n        if (::analogShoulder.isInitialized) analogShoulder.setInputEnabled(enabled)\n        updateButtonVisual()''',
          'left engine analog sync')

          s = s.replace(
          '''            circleEditMode || (::manualTapPair.isInitialized && manualTapPair.isEditing) -> Color.rgb(30, 165, 92)''',
          '''            circleEditMode ||\n                (::manualTapPair.isInitialized && manualTapPair.isEditing) ||\n                (::analogShoulder.isInitialized && analogShoulder.isEditing) -> Color.rgb(30, 165, 92)''',
          1)
          s = s.replace(
          '''            circleEditMode || (::manualTapPair.isInitialized && manualTapPair.isEditing) -> "✓"''',
          '''            circleEditMode ||\n                (::manualTapPair.isInitialized && manualTapPair.isEditing) ||\n                (::analogShoulder.isInitialized && analogShoulder.isEditing) -> "✓"''',
          1)

          menu_anchor = '''        content.addView(sectionLabel("SHOULDER  •  R / L", Color.rgb(150, 49, 76)), matchWrap())\n        content.addView(shoulderControlCard(), matchWrap())'''
          menu_insert = '''        if (::analogShoulder.isInitialized) {\n            content.addView(\n                sectionLabel("V6  •  ANALOG SHOULDER  •  ${analogShoulder.bindingLabel}", Color.rgb(38, 118, 150)),\n                matchWrap(),\n            )\n            val analogActions = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }\n            analogActions.addView(\n                microCard("✥ تعديل القاعدة") {\n                    closeMenu()\n                    analogShoulder.beginEditing()\n                    updateButtonVisual()\n                    showMessage("حرّك قاعدة V6 ثم افتح القائمة واضغط حفظ")\n                },\n                LinearLayout.LayoutParams(0, dp(40), 1f),\n            )\n            analogActions.addView(\n                microCard("✓ حفظ") {\n                    analogShoulder.finishEditing()\n                    updateButtonVisual()\n                    closeMenu()\n                    showMessage("تم حفظ قاعدة V6 وقفل موضعها")\n                },\n                LinearLayout.LayoutParams(0, dp(40), 1f),\n            )\n            analogActions.addView(\n                microCard(if (analogShoulder.isVisible) "◉ إخفاء" else "○ إظهار") {\n                    analogShoulder.toggleVisible()\n                    closeMenu()\n                },\n                LinearLayout.LayoutParams(0, dp(40), 1f),\n            )\n            content.addView(analogActions, matchWrap(dp(42)))\n            content.addView(\n                analogSizeRow(\n                    "BASE",\n                    { analogShoulder.baseSizeLabel },\n                    { analogShoulder.decreaseBaseSize() },\n                    { analogShoulder.increaseBaseSize() },\n                ),\n                matchWrap(dp(44)),\n            )\n            content.addView(\n                analogSizeRow(\n                    "KNOB",\n                    { analogShoulder.knobSizeLabel },\n                    { analogShoulder.decreaseKnobSize() },\n                    { analogShoulder.increaseKnobSize() },\n                ),\n                matchWrap(dp(44)),\n            )\n            content.addView(\n                TextView(this).apply {\n                    text = "3 نقرات سريعة تبدّل R/L • الضغط والسحب يبقيان الكتف DOWN • الإفلات = UP"\n                    textSize = 10.5f\n                    gravity = Gravity.CENTER\n                    setTextColor(Color.rgb(55, 75, 86))\n                    setPadding(dp(5), dp(3), dp(5), dp(6))\n                },\n                matchWrap(),\n            )\n        }\n\n        content.addView(sectionLabel("SHOULDER  •  R / L", Color.rgb(150, 49, 76)), matchWrap())\n        content.addView(shoulderControlCard(), matchWrap())'''
          s = replace_once(s, menu_anchor, menu_insert, 'V6 menu section')

          helper_anchor = '''    private fun sectionLabel(value: String, color: Int) = TextView(this).apply {'''
          helper = '''    private fun analogSizeRow(\n        label: String,\n        value: () -> String,\n        decrease: () -> Unit,\n        increase: () -> Unit,\n    ): View {\n        val row = LinearLayout(this).apply {\n            orientation = LinearLayout.HORIZONTAL\n            gravity = Gravity.CENTER_VERTICAL\n        }\n        val current = TextView(this).apply {\n            textSize = 12f\n            gravity = Gravity.CENTER\n            setTextColor(Color.rgb(42, 65, 78))\n            background = roundedBackground(Color.rgb(232, 246, 250), Color.rgb(87, 151, 174), 10f)\n        }\n        fun refresh() { current.text = "$label  ${value()}" }\n        row.addView(microCard("−") { decrease(); refresh() }, LinearLayout.LayoutParams(dp(58), dp(40)))\n        row.addView(current, LinearLayout.LayoutParams(0, dp(40), 1f))\n        row.addView(microCard("+") { increase(); refresh() }, LinearLayout.LayoutParams(dp(58), dp(40)))\n        refresh()\n        return row\n    }\n\n    private fun sectionLabel(value: String, color: Int) = TextView(this).apply {'''
          s = replace_once(s, helper_anchor, helper, 'analog size row helper')

          s = replace_once(s,
          '''        return "PixelProbe: ${engineStatusText()}  •  R/L: ${ShoulderCaptureService.statusSummary()}  •  $manual"''',
          '''        val analog = if (::analogShoulder.isInitialized) "V6 ${analogShoulder.bindingLabel}" else "V6 --"\n        return "PixelProbe: ${engineStatusText()}  •  R/L: ${ShoulderCaptureService.statusSummary()}  •  $manual  •  $analog"''',
          'combined status')

          s = replace_once(s,
          '''        if (::manualTapPair.isInitialized) manualTapPair.updateBounds(screenWidth, screenHeight)''',
          '''        if (::manualTapPair.isInitialized) manualTapPair.updateBounds(screenWidth, screenHeight)\n        if (::analogShoulder.isInitialized) analogShoulder.updateBounds(screenWidth, screenHeight)''',
          'rotation analog')

          s = replace_once(s,
          '''        if (::manualTapPair.isInitialized) manualTapPair.destroy()\n        menuButton?.let''',
          '''        if (::manualTapPair.isInitialized) manualTapPair.destroy()\n        if (::analogShoulder.isInitialized) analogShoulder.destroy()\n        menuButton?.let''',
          'destroy analog')

          s = s.replace('PixelTrigger V5 OFF', 'PixelTrigger V6 OFF')
          s = s.replace('PixelTrigger V5  •  Group', 'PixelTrigger V6  •  Group')
          s = s.replace('NotificationChannel(CHANNEL_ID, "PixelTrigger V5"', 'NotificationChannel(CHANNEL_ID, "PixelTrigger V6"')
          s = s.replace('.setContentTitle("PixelTrigger V5")', '.setContentTitle("PixelTrigger V6")')
          p.write_text(s)

          # Visible application branding.
          p = Path('app/src/main/java/com/pixeltrigger/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('PixelTrigger V5', 'PixelTrigger V6')
          s = s.replace('P5.', 'P6.')
          p.write_text(s)

          # V6 version marker.
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          if 'versionCode = 61' not in s or 'versionName = "5.0-group5-independent-burst"' not in s:
              raise SystemExit('version anchor not found')
          s = s.replace('versionCode = 61', 'versionCode = 62', 1)
          s = s.replace('versionName = "5.0-group5-independent-burst"', 'versionName = "6.0-analog-shoulder"', 1)
          p.write_text(s)
          PY
          git diff --check

      - name: Test and build
        run: gradle --no-daemon --rerun-tasks clean :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit clean V6 source
        shell: bash
        run: |
          rm -f .github/workflows/v6-analog-build.yml
          git config user.name 'CHATGPT'
          git config user.email 'abdrrahmaneabou@gmail.com'
          git add -A
          git commit -m 'feat: introduce V6 finger-driven analog shoulder'
          git push origin HEAD:v6-analog-shoulder
